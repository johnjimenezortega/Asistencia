<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Asistencia Kiosco</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      text-align: center; 
      margin: 0; 
      background: #0f172a; 
      color: white; 
      display: flex; 
      flex-direction: column; 
      height: 100vh; 
      justify-content: center; 
      align-items: center; 
    }
    #reader { 
      width: 340px; 
      border-radius: 16px; 
      overflow: hidden; 
      border: 3px solid #38bdf8; 
    }
    #mensaje { 
      margin-top: 20px; 
      font-size: 1.4rem; 
      min-height: 50px; 
      font-weight: bold; 
    }
    .exito { color: #4ade80; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <h2>Pasa tu código QR</h2>
  <div id="reader"></div>
  <div id="mensaje">Listo para escanear</div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxRRNg5xtmwhGSZBV53ffplUemKFSL5iN3rQ0lds8eQkNXuoAFbuxQjvLwb6_cpWDfd/exec"; 
    let bloqueado = false;

    function onScanSuccess(decodedText) {
      if (bloqueado) return;
      bloqueado = true;

      const mensajeEl = document.getElementById("mensaje");
      mensajeEl.className = "";
      mensajeEl.innerText = "Registrando...";

      fetch(WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ id: decodedText })
      }).then(() => {
        mensajeEl.className = "exito";
        mensajeEl.innerText = `¡Registrado! (${decodedText})`;
        
        // Espera de 2 segundos antes de admitir el siguiente escaneo
        setTimeout(() => {
          mensajeEl.className = "";
          mensajeEl.innerText = "Listo para escanear";
          bloqueado = false;
        }, 2000);
      }).catch(err => {
        mensajeEl.className = "error";
        mensajeEl.innerText = "Error al registrar";
        bloqueado = false;
      });
    }

    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "user" }, // Usa la cámara frontal del iPad
      { fps: 10, qrbox: 250 },
      onScanSuccess
    );
  </script>
</body>
</html>
